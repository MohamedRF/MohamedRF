<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" role="img" aria-labelledby="title">
  <title id="title">Animated cup of coffee</title>
  <defs>
    <linearGradient id="cupGrad" x1="32" y1="38" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79CFC3"/>
      <stop offset=".55" stop-color="#83B8DB"/>
      <stop offset="1" stop-color="#B39BE4"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="38" y1="42" x2="82" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A2C1A"/>
      <stop offset="1" stop-color="#6B4423"/>
    </linearGradient>
  </defs>

  <!-- Pulse halo -->
  <circle cx="60" cy="68" r="30" fill="#79CFC3" opacity="0.15">
    <animate attributeName="r" values="28;38;28" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="68" r="30" fill="#B39BE4" opacity="0.10">
    <animate attributeName="r" values="38;28;38" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.22;0.05" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Steam -->
  <g stroke-linecap="round" stroke-width="3" fill="none">
    <path d="M48 34c-3 7 3 9 0 16" stroke="#79CFC3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -6" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M60 34c-3 7 3 9 0 16" stroke="#83B8DB" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin=".4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -6" dur="1.8s" begin=".4s" repeatCount="indefinite"/>
    </path>
    <path d="M72 34c-3 7 3 9 0 16" stroke="#B39BE4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin=".8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -6" dur="1.8s" begin=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Saucer -->
  <ellipse cx="60" cy="98" rx="34" ry="6" fill="#B39BE4" opacity="0.25"/>

  <!-- Cup body -->
  <path d="M32 42h56v26c0 14-10 22-26 22H48c-16 0-16-8-16-22V42z" fill="url(#cupGrad)"/>
  <!-- Handle -->
  <path d="M88 48c12 0 12 16 0 16" fill="none" stroke="#83B8DB" stroke-width="5" stroke-linecap="round"/>
  <!-- Coffee surface -->
  <ellipse cx="60" cy="42" rx="28" ry="5" fill="url(#coffeeGrad)"/>
  <!-- Shine -->
  <path d="M40 52c0 14 4 24 10 28" fill="none" stroke="white" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
</svg>
